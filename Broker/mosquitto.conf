# Mosquitto configuration for the broker embedded in the HomeControl container (see ../Dockerfile and
# entrypoint.sh). Nothing secret lives here: the password file is generated at container start from
# environment variables supplied by the host (Container App secrets).
#
# Both listeners are loopback-only. The backend talks to 1883 directly; everything from the outside
# (the Raspberry Pi device, and any web/mobile MQTT client) arrives as a secure WebSocket on the app's
# HTTPS endpoint (wss://<host>/mqtt, TLS terminated by the platform ingress), which the backend
# forwards to the WebSocket listener on 9001 - see HomeControlBackEnd/Features/Broker.

allow_anonymous false

listener 1883 127.0.0.1

listener 9001 127.0.0.1
protocol websockets

# Authentication (users + hashed passwords) and authorization (per-user topics).
plugin /usr/lib/mosquitto/mosquitto_password_file.so
plugin_opt_password_file /run/mosquitto/passwd
plugin /usr/lib/mosquitto/mosquitto_acl_file.so
plugin_opt_acl_file /etc/mosquitto/aclfile

# The ingress drops idle connections after a few minutes; require clients to ping well within that.
max_keepalive 120

# State is not worth persisting: devices republish their state periodically. The only retained message is the
# device's entrance/motion-triggers state, which lives in memory for as long as the broker runs.
persistence false

log_dest stderr
log_type error
log_type warning
log_type notice
connection_messages true
