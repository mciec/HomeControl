# Builds the production Docker image (frontend + backend, see Dockerfile) and publishes it to the
# GitHub Container Registry: ghcr.io/<owner>/homecontrol:latest (and :<commit sha>).
#
# Azure Container Apps pulls this image anonymously, so the package must be PUBLIC (GitHub creates new
# packages as private: Packages -> homecontrol -> Package settings -> Change visibility -> Public, once).
# The image contains no secrets - Google/MQTT credentials are supplied as environment variables at runtime.
name: Publish image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - HomeControlBackEnd/**
      - HomeControlFrontEnd/**
      - Shared/**
      - .github/workflows/publish-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/homecontrol
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
